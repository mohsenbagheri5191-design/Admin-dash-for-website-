# ═══════════════════════════════════════════════════════════════
#  Publish to GitHub Pages
# ═══════════════════════════════════════════════════════════════
#  A review preview, so the site can be opened and tested from a URL.
#
#  Netlify remains the production target: GitHub Pages cannot serve the
#  _headers file, so the Content Security Policy and the other security
#  headers do NOT apply here, and netlify.toml's clean-URL redirects do not
#  either. Every route is a real file, so nothing 404s — but treat this as a
#  preview, not production. See DASHBOARD.md § Deploying.
#
#  The site resolves its own base path at runtime (assets/js/paths.js), so the
#  same build works at https://user.github.io/repo/ and at a domain root.

name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/google-extension-integration-v54xsg]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer push finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Writes assets/js/env.js and _headers. env.js is the only one Pages
      # actually uses; _headers is written anyway so the artifact matches
      # what Netlify would publish.
      - name: Build config
        run: node tools/build-config.mjs
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      - name: Prove no model coefficients or secrets are in the bundle
        run: bash tools/verify-no-secrets.sh

      # Jekyll would otherwise swallow paths beginning with an underscore.
      - name: Disable Jekyll
        run: touch .nojekyll

      # docs/proof holds review screenshots that include example account rows.
      # They belong in the repo, not on a public URL.
      - name: Drop review screenshots from the published site
        run: rm -rf docs

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
