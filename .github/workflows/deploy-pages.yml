# ═══════════════════════════════════════════════════════════════
#  Publish to GitHub Pages
# ═══════════════════════════════════════════════════════════════
#  A review preview, so the site can be opened and tested from a URL.
#
#  Why this pushes a branch instead of using actions/deploy-pages:
#  the default GITHUB_TOKEN cannot create or reconfigure a Pages site
#  ("Resource not accessible by integration"), so actions/configure-pages
#  fails. Pages here is served from the gh-pages branch, and writing to a
#  branch needs only contents: write — which the token does have.
#
#  Netlify remains the production target. GitHub Pages cannot serve the
#  _headers file, so the Content Security Policy and the other security
#  headers do NOT apply to this preview, and netlify.toml's clean-URL
#  redirects do not either. Every route is a real file, so nothing 404s.
#  See DASHBOARD.md § Deploying.
#
#  The site resolves its own base path at runtime (assets/js/paths.js), so the
#  same build works under /Admin-dash-for-website-/ and at a domain root.

name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/google-extension-integration-v54xsg]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Writes assets/js/env.js and _headers. env.js is the only one Pages
      # uses; _headers is written anyway so the payload matches what Netlify
      # would publish.
      - name: Build config
        run: node tools/build-config.mjs
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      - name: Prove no model coefficients or secrets are in the bundle
        run: bash tools/verify-no-secrets.sh

      - name: Assemble the publish payload
        run: |
          rm -rf /tmp/site && mkdir -p /tmp/site
          # docs/proof holds review screenshots that include example account
          # rows; they belong in the repo, not on a public URL.
          tar --exclude='./.git' --exclude='./docs' --exclude='./.github' \
              --exclude='./node_modules' -cf - . | tar -xf - -C /tmp/site
          # Jekyll would otherwise swallow paths beginning with an underscore.
          touch /tmp/site/.nojekyll

      - name: Push to gh-pages
        run: |
          cd /tmp/site
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -q -f \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
